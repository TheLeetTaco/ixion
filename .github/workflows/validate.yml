name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: shellcheck
        run: |
          shellcheck --severity=error \
            install_claude_code.sh \
            tests/cleanup.sh \
            tests/branch-resolution-harness.sh \
            tests/session-resolution-harness.sh \
            tests/finding-synthesis-harness.sh \
            tests/integration/run.sh \
            tests/integration/cases/*.test.sh
          # lib files are sourced, not executed — tell shellcheck the dialect
          shellcheck --severity=error --shell=bash tests/integration/lib/*.sh

      # Credential-free and seconds long: these run the reference files' own
      # fenced blocks against throwaway repos, so a renamed heading, a broken
      # block or a drifted schema fails here rather than in front of a user.
      - name: offline harnesses
        run: |
          bash tests/branch-resolution-harness.sh
          bash tests/session-resolution-harness.sh
          bash tests/finding-synthesis-harness.sh

      - name: compile JSON schemas
        run: |
          for s in ixion/schemas/*.schema.json; do
            bunx ajv-cli compile --spec=draft2020 --validate-formats=false -s "$s"
          done

      - name: validate findings example against its schema
        run: |
          bunx ajv-cli validate --spec=draft2020 --validate-formats=false \
            -s ixion/schemas/findings.schema.json \
            -d ixion/schemas/findings.example.json

      - name: plugin/marketplace version parity
        run: |
          python3 -c '
          import json, sys
          marketplace = json.load(open(".claude-plugin/marketplace.json"))
          plugin = json.load(open("ixion/.claude-plugin/plugin.json"))["version"]
          catalog = marketplace["version"]
          entry = marketplace["plugins"][0]["version"]
          if len({plugin, catalog, entry}) > 1:
              sys.exit(f"Version mismatch: plugin.json={plugin} marketplace.json={catalog} marketplace entry={entry}")
          print(f"Versions in sync: {plugin}")
          '

      - name: frontmatter sanity (every agent/skill has name + description)
        run: |
          fail=0
          for f in ixion/agents/*.md ixion/skills/*/SKILL.md; do
            head -n 30 "$f" | grep -q '^name:' || { echo "missing name: $f" >&2; fail=1; }
            head -n 30 "$f" | grep -q '^description:' || { echo "missing description: $f" >&2; fail=1; }
          done
          exit $fail
